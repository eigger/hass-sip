# Ruff configuration.
#
# Ruff is pinned in requirements_lint.txt; the rule selection is pinned here so
# a ruff upgrade cannot change the effective rule set: E/F are the pycodestyle+pyflakes rules this codebase was already
# clean against (real errors: undefined names, unused imports, syntax issues).
[lint]
select = ["E", "F"]

# Long lines are common in SIP/SDP strings and log-message formatting and
# are not worth churning; everything else in E/F stays enforced.
ignore = ["E501"]
