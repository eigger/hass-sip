# Shared standards: eigger/hass-repo-standards@7acd9cab6ac774e4695f2c962e3d88b5faa4620d
name: Tests
'on':
  push:
    branches:
    - main
  pull_request: null
  workflow_dispatch: null
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
# "current" installs the pinned current HA; "minimum-ha" installs the exact
# hacs.json minimum in a separate environment. The suite mocks Home Assistant
# (test-profile: unit), so these jobs verify installability/resolution and the
# mocked unit tests only. Real-HA tests are tracked in ADOPTION_CHECKLIST.md.
jobs:
  current:
    uses: eigger/hass-repo-standards/.github/workflows/python-tests.yml@7acd9cab6ac774e4695f2c962e3d88b5faa4620d
    with:
      domain: sip
      python-versions: '["3.14"]'
      requirements: requirements_test.txt
      expected-ha-version: '2026.10.2'
      test-profile: unit
      pytest-args: tests/ -v
  minimum-ha:
    uses: eigger/hass-repo-standards/.github/workflows/python-tests.yml@7acd9cab6ac774e4695f2c962e3d88b5faa4620d
    with:
      domain: sip
      python-versions: '["3.14"]'
      requirements: requirements_test_min.txt
      expected-ha-version: '2026.10.0'
      test-profile: unit
      pytest-args: tests/ -v
