name: Tests

on:
  push:
    branches: [main, master]
  pull_request:

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.14"

      - name: Install ruff
        run: pip install ruff

      - name: Lint
        run: python -m ruff check custom_components/

  test:
    runs-on: ubuntu-latest
    needs: lint
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.14"]
    steps:
      - uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install pytest voluptuous "homeassistant>=2026.8.0"
          if [ -f custom_components/sip/manifest.json ]; then
            python -c "import json; reqs = json.load(open('custom_components/sip/manifest.json')).get('requirements', []); print('\n'.join(reqs))" > requirements.txt
            if [ -s requirements.txt ]; then
              pip install -r requirements.txt
            fi
          fi

      - name: Run tests
        run: |
          python -m pytest tests/
