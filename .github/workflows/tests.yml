# Shared standards: eigger/hass-repo-standards@0c1592977591ecba077a4666d699840062711201
name: Tests
'on':
  push:
    branches:
    - main
  pull_request: null
  workflow_dispatch: null
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
# "current" tests the pinned current HA; "minimum-ha" tests the exact
# hacs.json minimum in a separate environment. Both run the real-HA suite
# (test-profile: ha, pytest-homeassistant-custom-component) in
# tests/components/sip/. ha-components installs the requirements of the
# manifest dependencies (ffmpeg, llm, logbook, media_source, tts) and the
# after_dependencies the integration imports (assist_pipeline, stt) from the
# installed HA.
jobs:
  current:
    uses: eigger/hass-repo-standards/.github/workflows/python-tests.yml@v1.0.0
    with:
      standards-ref: 44349ee5621eea5d80e5c427f7a2435d2c2491bb
      domain: sip
      python-versions: '["3.14"]'
      requirements: requirements_test.txt
      expected-ha-version: '2026.10.2'
      test-profile: ha
      ha-components: ffmpeg llm logbook media_source tts assist_pipeline stt
      pytest-args: tests/components/sip/ -v
  minimum-ha:
    uses: eigger/hass-repo-standards/.github/workflows/python-tests.yml@v1.0.0
    with:
      standards-ref: 44349ee5621eea5d80e5c427f7a2435d2c2491bb
      domain: sip
      python-versions: '["3.14"]'
      requirements: requirements_test_min.txt
      expected-ha-version: '2026.10.0'
      test-profile: ha
      ha-components: ffmpeg llm logbook media_source tts assist_pipeline stt
      pytest-args: tests/components/sip/ -v
