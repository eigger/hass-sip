# Shared standards: eigger/hass-repo-standards@7acd9cab6ac774e4695f2c962e3d88b5faa4620d
name: Validate
'on':
  push:
    branches:
    - main
  pull_request: null
  workflow_dispatch: null
  schedule:
  - cron: 23 3 * * 1
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  validate:
    uses: eigger/hass-repo-standards/.github/workflows/validate-integration.yml@7acd9cab6ac774e4695f2c962e3d88b5faa4620d
