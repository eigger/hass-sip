# Shared standards: eigger/hass-repo-standards@0c1592977591ecba077a4666d699840062711201
name: Validate
'on':
  push:
    branches:
    - main
  pull_request: null
  workflow_dispatch: null
  schedule:
  - cron: 23 3 * * 1
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  validate:
    uses: eigger/hass-repo-standards/.github/workflows/validate-integration.yml@v1.1.2
    with:
      # Published Hassfest predates categories support; use reviewed Core schema.
      hassfest-core-ref: ec18d8b25d1ee39aa8b85a72a170e42bee33228c
