version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
  - package-ecosystem: pip
    directory: /
    schedule:
      interval: weekly
    # Keep the historical minimum-HA environment fixed.
    exclude-paths:
      - requirements_test_min.txt
    groups:
      home-assistant-tests:
        patterns:
          - homeassistant
